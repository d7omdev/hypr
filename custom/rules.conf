# # group 2
# workspace=4, monitor:eDP-2,     persistent:true
# workspace=5, monitor:eDP-2,     persistent:true
# workspace=6, monitor:HDMI-A-1, persistent:true
#
# # group 3
# workspace=7, monitor:HDMI-A-1,     persistent:true
# workspace=8, monitor:HDMI-A-1,     persistent:true
# workspace=9, monitor:HDMI-A-1, persistent:true
# workspace=0, monitor:HDMI-A-1, persistent:true

# Openscreen (no styling)
windowrule {
  name = openscreen

  border_size = 0
  rounding = 0
  no_blur = on
}
