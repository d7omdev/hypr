# ######## Custom Window rules ########

# Clipboard manager
windowrule = match:title ^(Clipse GUI)$, float on
# windowrule = match:title ^(Clipse GUI)$, size (monitor_w*.25) (monitor_h*.60)
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, size (monitor_w*.30) (monitor_h*.50)
windowrule = match:class ^(clipse)$, border_size 2

# Workspace assignments
windowrule = match:class ^(spotify)$, workspace 0
windowrule = match:class ^(Postman)$, workspace 4
windowrule = match:class ^(kitty)$, no_blur off
windowrule = match:class ^(zen)$, no_blur off
windowrule = match:class ^(teams-for-linux)$, workspace 3


windowrule = match:title ^(Ente Auth)$, float on
windowrule = match:class ^(hyprland-share-picker)$, float on
windowrule = match:class ^(org.kde.kdeconnect.daemon)$, float on
windowrule = match:title ^(Ente Auth)$, size (monitor_w*.25) (monitor_h*.60)

# Google sign-in popup (Zen Browser)
windowrule = match:class ^(zen)$, match:title ^(Sign in - Google Accounts), float on
windowrule = match:class ^(zen)$, match:title ^(Sign in - Google Accounts), size (monitor_w*.40) (monitor_h*.70)
windowrule = match:class ^(zen)$, match:title ^(Sign in - Google Accounts), center on

# Noctalia Shell
layerrule = match:namespace noctalia-background-.*, blur on
layerrule = match:namespace noctalia-background-.*, blur_popups on
layerrule = match:namespace noctalia-background-.*, ignore_alpha 0.8


# # group 1
# workspace=1, monitor:eDP-2,     persistent:true
# workspace=2, monitor:HDMI-A-1,     persistent:true
# workspace=3, monitor:HDMI-A-1, persistent:true
