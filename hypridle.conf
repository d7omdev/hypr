# end4-pC lock is a Hyprland GlobalShortcut. On the Lua-config compositor,
# `hyprctl dispatch` parses its args as Lua, so the global name must be a
# quoted string inside hl.dsp.global(...). (The old `dispatch global quickshell:X`
# bare-token form no longer parses — that's why after_sleep_cmd was silently failing.)
$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")'
$suspend_cmd = $lock_cmd

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 120
}

listener {
    timeout = 300 # 5mins
    on-timeout = $lock_cmd
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
